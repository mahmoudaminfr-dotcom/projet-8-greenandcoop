version: 2

models:
  - name: dim_weather_stations
    description: "Table de dimension regroupant les stations météo InfoClimat et Weather Underground"
    columns:
      - name: station_id
        description: "Identifiant unique de la station"
        tests:
          - unique
          - not_null
      - name: station_name
        description: "Nom de la station météorologique"
        tests:
          - not_null
      - name: source_network
        description: "Réseau d'origine de la station"
        tests:
          - not_null

  - name: fct_weather_readings
    description: "Table de faits centrale consolidant l'ensemble des observations météo standardisées"
    columns:
      - name: reading_id
        description: "Clé primaire de substitution (MD5 de station_id et recorded_at_utc)"
        tests:
          - unique
          - not_null
      - name: station_id
        description: "Clé étrangère référençant la station dans dim_weather_stations"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_weather_stations')
                field: station_id
      - name: recorded_at_utc
        description: "Horodatage de l'observation standardisé en UTC"
        tests:
          - not_null
      - name: temperature_celsius
        description: "Température relevée convertie en degrés Celsius"
        tests:
          - not_null